<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>Gram Panchayat GP. Jhanda Khurd</title>
    <meta name="description" content="Gram Panchayat GP. Jhanda Khurd - Automated Billing System." />
    <meta property="og:title" content="Gram Panchayat GP. Jhanda Khurd" />
    <meta property="og:description" content="Gram Panchayat GP. Jhanda Khurd - Automated Billing System." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Clear service workers & all caches in preview iframe to ensure always latest version matches production
      (function() {
        var isIframe = window.self !== window.top;
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var isRunApp = window.location.hostname.indexOf('run.app') !== -1;
        var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        
        if ((isIframe || isLocal || isRunApp) && !isStandalone) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              if (registrations && registrations.length > 0) {
                var promises = registrations.map(function(reg) { return reg.unregister(); });
                Promise.all(promises).then(function() {
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      keys.forEach(function(k) { caches.delete(k); });
                    });
                  }
                  if (!sessionStorage.getItem('__sw_purged__')) {
                    sessionStorage.setItem('__sw_purged__', '1');
                    window.location.reload();
                  }
                });
              } else {
                if ('caches' in window) {
                  caches.keys().then(function(keys) {
                    keys.forEach(function(k) { caches.delete(k); });
                  });
                }
              }
            });
          }
        }
      })();

      // Suppress Vite HMR WebSocket closing errors in iframe/preview environment
      window.addEventListener('error', function (event) {
        if (
          event &&
          (String(event.message || '').includes('WebSocket closed without opened') ||
           String(event.filename || '').includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          String(event.reason.message || event.reason).includes('WebSocket closed without opened')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
